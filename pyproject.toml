[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elara-x-nrlmsis20-native"
version = "0.1.0.dev0"
description = "Accepted native NRLMSIS 2.0 compatibility implementation with external verified resources"
requires-python = ">=3.10"
authors = [{name = "Giuseppe A. A. Joulianou"}]

[tool.setuptools.packages.find]
where = ["src"]
